services:
  - type: web
    name: relay-app
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BIND_HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Optional dedicated TURN (overrides the built-in free fallback).
      # Vite inlines VITE_* at BUILD time — set these, then trigger a rebuild.
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
    healthCheckPath: /health
